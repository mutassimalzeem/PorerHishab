services:

  db:
    image: postgres:16
    container_name: zyra-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-porerhishab_dev}
      POSTGRES_USER: ${POSTGRES_USER:-porerhishab_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - zyra_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyra -d zyra"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  zyra_postgres_data:
