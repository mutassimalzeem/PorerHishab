# Reverse proxy configuration for PorerHishab
# Enforces operational boundaries, ingress size caps, request timeouts, and connection limits.

# Zone definitions for rate and connection limiting
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=30r/s;

upstream porerhishab_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name finance.example.com;

    # SSL configuration (TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Operational request limits (Issue D)
    # Reject oversized payloads before they reach application memory
    client_max_body_size 5M;
    client_body_buffer_size 128k;

    # Bounded request timeouts against slow-client attacks (Slowloris)
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 65s;

    # Concurrency and rate limits per IP
    limit_conn addr_limit 20;
    limit_req zone=req_limit burst=50 nodelay;

    location / {
        proxy_pass http://porerhishab_api;
        proxy_http_version 1.1;

        # Connection and header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Upstream proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_max_temp_file_size 10m;
    }

    # Health check endpoints: bypass rate limits for monitoring
    location ~ ^/health/(live|ready)$ {
        proxy_pass http://porerhishab_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }
}
