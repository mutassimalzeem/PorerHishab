name: Frontend and API contracts
on:
  pull_request:
  push:
    branches: [main, feature/ai-13-financial-intelligence]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
      AI_EXTERNAL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt pytest httpx
      - run: python scripts/generate_frontend_contracts.py --check
      - run: python -m pytest backend/test_financial_health.py backend/test_intelligence_api.py backend/test_intelligence_snapshot.py backend/test_intelligence_categories.py backend/test_intelligence_signals.py backend/test_intelligence_coverage.py backend/test_intelligence_periods.py backend/test_financial_runway.py backend/test_financial_timeline.py backend/test_financial_coaching.py backend/test_coaching_feedback.py backend/test_action_plan.py backend/test_action_outcome.py backend/test_obligation_cashflow.py backend/test_account_reconciliation.py -q
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: frontend/test-results
          retention-days: 7

  health-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: health
          POSTGRES_PASSWORD: health-test
          POSTGRES_DB: health_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U health -d health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://health:health-test@localhost:5432/health_test
      AI_EXTERNAL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-rag.txt pytest httpx
      - run: python -m alembic upgrade head
      - run: python -m pytest backend -q --tb=short
