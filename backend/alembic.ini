# Shim configuration so that `alembic` commands auto-discover a config file
# when run from the backend/ directory. It delegates to the canonical
# configuration in the repository root.

[alembic]
script_location = %(here)s/../alembic
prepend_sys_path = %(here)s
version_path_separator = os

sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration (required by alembic/env.py -> fileConfig)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
